name: build-audiobridge

on:
  workflow_dispatch:
  push:
    branches: [ "claude/hangul-characters-bplcwl" ]
    paths:
      - "audiobridge/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: audiobridge-rolling-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Release keystore (optional, Play 스토어용 시크릿)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
              echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
              echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
            echo "릴리스 키로 서명합니다"
          else
            echo "공유 디버그 키로 서명합니다 (사이드로딩용)"
          fi

      - name: Build APK + AAB
        working-directory: audiobridge/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=2.4.${{ github.run_number }}

      - name: Build Windows exe (win-x64, single file)
        working-directory: audiobridge/windows
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:Version=2.4.${{ github.run_number }}
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Assemble dist package
        run: |
          mkdir -p dist/AudioBridge
          cp audiobridge/android/app/build/outputs/apk/release/app-release.apk dist/AudioBridge/AudioBridge.apk
          cp audiobridge/android/app/build/outputs/bundle/release/app-release.aab dist/AudioBridge.aab
          cp audiobridge/windows/out/AudioBridgeWin.exe dist/AudioBridge/
          cp audiobridge/windows/out/AudioBridgeWin.exe dist/AudioBridgeWin.exe
          cp audiobridge/README.md audiobridge/PROTOCOL.md audiobridge/HANDOFF.md dist/AudioBridge/
          APK_SHA=$(sha256sum dist/AudioBridge/AudioBridge.apk | cut -d ' ' -f1)
          WIN_SHA=$(sha256sum dist/AudioBridgeWin.exe | cut -d ' ' -f1)
          cat > dist/latest.json <<EOF
          {"versionCode": ${{ github.run_number }}, "versionName": "2.4.${{ github.run_number }}", "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v1.0.0-build/AudioBridge.apk", "apkSha256": "$APK_SHA", "windowsUrl": "https://github.com/${{ github.repository }}/releases/download/v1.0.0-build/AudioBridgeWin.exe", "windowsSha256": "$WIN_SHA"}
          EOF
          cd dist && zip -r AudioBridge-dist.zip AudioBridge

      - uses: actions/upload-artifact@v4
        with:
          name: AudioBridge-dist
          path: dist/AudioBridge-dist.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AudioBridge-apk
          path: dist/AudioBridge/AudioBridge.apk

      - name: Point rolling release tag at this build
        run: |
          git tag -f v1.0.0-build "$GITHUB_SHA"
          git push origin refs/tags/v1.0.0-build --force

      - name: Publish release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build
          target_commitish: ${{ github.sha }}
          name: "AudioBridge v2.4 (자동 빌드)"
          prerelease: true
          overwrite_files: true
          body: |
            폰↔PC 양방향 오디오 스트리밍 — 공통 시계·하드웨어 재생 위치 기반 동기화와 Android풍 Windows UI가 적용된 롤링 빌드입니다.
            - `AudioBridge.apk`: 안드로이드 앱 (Android 8.0+)
            - `AudioBridgeWin.exe`: 윈도우 단일 실행파일 (앱 내 자동 업데이트 지원)
            - `AudioBridge-dist.zip`: APK + 윈도우 실행파일 + 문서
          files: |
            dist/AudioBridge-dist.zip
            dist/AudioBridge/AudioBridge.apk
            dist/AudioBridge.aab
            dist/AudioBridgeWin.exe
            dist/latest.json
