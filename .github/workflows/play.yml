# Play 제출용 사본(geulbeot-play)의 AAB를 만듭니다.
#
# 이 개발 환경에서는 안드로이드 SDK를 받을 수 없어서 (dl.google.com 차단) 빌드할 수 있는 곳이
# 여기뿐입니다. 원본을 빌드하는 android.yml과 별개로 두는 이유는 두 가지입니다: 사본은
# targetSdk 36 + AGP 8.13이라 SDK 구성이 다르고, 매 푸시마다 두 번 빌드할 이유가 없습니다.
name: 글벗 Play AAB

on:
  workflow_dispatch:
  push:
    paths: ["geulbeot-play/**", ".github/workflows/play.yml"]

permissions:
  contents: read

concurrency:
  group: play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: AAB 빌드
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 준비
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > geulbeot-play/local.properties

      - name: 서명 준비
        id: signing
        working-directory: geulbeot-play
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > upload.jks
            {
              echo "storeFile=upload.jks"
              echo "storePassword=${STORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "keyPassword=${KEY_PASSWORD}"
            } > keystore.properties
            echo "signed=yes" >> "$GITHUB_OUTPUT"
            echo "업로드 키로 서명합니다."
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::업로드 키가 없어 서명 없이 빌드합니다. Play는 서명 없는 AAB를 거부합니다. 컴파일 확인용으로만 쓰세요."
          fi

      - name: AAB 빌드
        working-directory: geulbeot-play
        run: ./gradlew :app:bundleRelease --no-daemon --console=plain

      - name: 서명 재료 지우기
        if: always()
        working-directory: geulbeot-play
        run: rm -f upload.jks keystore.properties

      - name: 결과 모으기
        id: out
        run: |
          set -euo pipefail
          mkdir -p out
          AAB=$(find geulbeot-play/app/build/outputs/bundle -name '*.aab' -print -quit)
          if [ -z "$AAB" ]; then echo "AAB가 만들어지지 않았습니다." >&2; exit 1; fi
          SUFFIX=$([ "${{ steps.signing.outputs.signed }}" = "yes" ] && echo "" || echo "-unsigned")
          cp "$AAB" "out/geulbeot-1.0.0${SUFFIX}.aab"
          # 난독화된 크래시 로그를 되읽으려면 이 파일이 반드시 있어야 합니다. 버전별로 보관하세요.
          cp geulbeot-play/app/build/outputs/mapping/release/mapping.txt out/mapping.txt
          ls -la out/

      - name: 내려받을 수 있게 올리기
        uses: actions/upload-artifact@v4
        with:
          name: geulbeot-play-aab
          path: out/
          retention-days: 90
