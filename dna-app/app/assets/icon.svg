<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- DNA 편집 스튜디오 아이콘: 신문 + 펜 + DNA 이중나선 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B5BB8"/>
      <stop offset="1" stop-color="#1A3A7A"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- 신문 -->
  <g transform="translate(46 58)">
    <rect x="0" y="0" width="118" height="140" rx="10" fill="#FFFBF7"/>
    <rect x="12" y="14" width="94" height="22" rx="4" fill="#23293A"/>
    <rect x="12" y="46" width="58" height="6" rx="3" fill="#9BA6BC"/>
    <rect x="12" y="60" width="58" height="6" rx="3" fill="#9BA6BC"/>
    <rect x="12" y="74" width="58" height="6" rx="3" fill="#9BA6BC"/>
    <rect x="78" y="46" width="28" height="34" rx="4" fill="#15B1FF"/>
    <rect x="12" y="92" width="94" height="6" rx="3" fill="#C6CEDD"/>
    <rect x="12" y="106" width="94" height="6" rx="3" fill="#C6CEDD"/>
    <rect x="12" y="120" width="66" height="6" rx="3" fill="#FFD60A"/>
  </g>

  <!-- DNA 이중나선 -->
  <g stroke-linecap="round" fill="none">
    <path d="M186 52 C 214 72, 158 100, 186 120 C 214 140, 158 168, 186 188"
          stroke="#7FD1FF" stroke-width="10"/>
    <path d="M214 52 C 186 72, 242 100, 214 120 C 186 140, 242 168, 214 188"
          stroke="#FFFFFF" stroke-width="10"/>
    <g stroke="#BFE6FF" stroke-width="7">
      <line x1="192" y1="66" x2="208" y2="66"/>
      <line x1="188" y1="104" x2="212" y2="104"/>
      <line x1="192" y1="134" x2="208" y2="134"/>
      <line x1="188" y1="172" x2="212" y2="172"/>
    </g>
  </g>

  <!-- 펜 -->
  <g transform="rotate(40 96 210)">
    <rect x="56" y="196" width="120" height="22" rx="11" fill="#FFD60A"/>
    <path d="M176 196 L 206 207 L 176 218 Z" fill="#23293A"/>
    <rect x="56" y="196" width="18" height="22" rx="9" fill="#E5B800"/>
  </g>
</svg>
