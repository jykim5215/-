<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNA 편집 스튜디오</title>
<link rel="stylesheet" href="styles.css?v=redesign-2026">
</head>
<body>
  <div class="shell">
    <!-- 좌측 레일: 내비게이션 -->
    <aside class="rail">
      <div class="rail-logo"><span class="badge">DNA</span><span class="rail-title">편집 스튜디오</span></div>

      <section class="rail-group project-group" aria-labelledby="projectGroupLabel">
        <div class="rail-group-head">
          <span id="projectGroupLabel">프로젝트</span>
          <span class="rail-group-actions">
            <button id="newProjectBtn" class="rail-add" type="button" title="새 프로젝트" aria-label="새 프로젝트">+</button>
            <button id="renameProjectBtn" class="rail-add" type="button" title="프로젝트 이름 변경" aria-label="프로젝트 이름 변경">✎</button>
            <button id="deleteProjectBtn" class="rail-add danger" type="button" title="프로젝트 삭제" aria-label="프로젝트 삭제">×</button>
          </span>
        </div>
        <div id="projectList" class="project-list" aria-label="프로젝트 목록"></div>
      </section>

      <div class="rail-menu-groups">
        <section class="rail-group" aria-labelledby="createGroupLabel">
          <div class="rail-group-head"><span id="createGroupLabel">기사 제작</span></div>
          <button id="flowMapBtn" class="rail-btn">진행 노트</button>
          <nav id="stepper" class="nav" aria-label="기사 제작 단계"></nav>
        </section>

        <section class="rail-group" aria-labelledby="communicationGroupLabel">
          <div class="rail-group-head"><span id="communicationGroupLabel">소통</span></div>
          <button id="mailCenterBtn" class="rail-btn">메일함</button>
        </section>

        <section class="rail-group" aria-labelledby="manageGroupLabel">
          <div class="rail-group-head"><span id="manageGroupLabel">관리</span></div>
          <button id="dashBtn" class="rail-btn">지표와 백업</button>
          <button id="devModeBtn" class="rail-btn" hidden aria-hidden="true" tabindex="-1">개발자 모드</button>
        </section>
      </div>

      <div class="rail-foot">
        <button id="settingsBtn" class="profile-btn" aria-label="프로필 열기">
          <span id="railAvatar" class="profile-avatar">DNA</span>
          <span class="profile-copy">
            <b id="railProfileName">프로필</b>
            <small id="railProfileTitle">이름과 계정 설정</small>
          </span>
          <span class="profile-gear" aria-hidden="true"></span>
        </button>
      </div>
    </aside>

    <!-- 메인 -->
    <div class="main">
      <header class="mainbar">
        <span id="crumb" class="crumb"></span>
        <span id="greeting" class="greeting"></span>
        <span id="saveState" class="save">대기</span>
        <button id="sideToggle" class="btn small ghost">패널</button>
      </header>

      <div class="frame">
        <main class="panel work" id="workArea"></main>

        <aside class="side">
          <section class="panel box">
            <h3>수집 자료 <span id="matCount"></span></h3>
            <div id="materialList"></div>
            <details class="add-mat">
              <summary>+ 자료 추가</summary>
              <input id="matTitle" placeholder="제목">
              <select id="matKind">
                <option value="transcript">인터뷰 녹취</option>
                <option value="url">URL 기사</option>
                <option value="file">문서</option>
                <option value="note">메모</option>
              </select>
              <textarea id="matContent" placeholder="본문/녹취 텍스트"></textarea>
              <input id="matSource" placeholder="출처 (필수 — 없으면 저장 불가)">
              <button id="matAddBtn" class="btn">자료 저장</button>
            </details>
            <details class="law-d">
              <summary>저작권법 제28조 인용 원칙</summary>
              인용은 주(主)·종(從) 관계를 지키고 출처를 반드시 표시합니다. 출처 없는 자료는 저장할 수 없습니다.
            </details>
          </section>

          <section class="panel box" id="validatorBox" hidden>
            <h3>자동 검사</h3>
            <div id="validatorResults"></div>
          </section>

          <section class="panel box" id="feedbackBox" hidden>
            <h3>이 결과 평가 <span class="hint">(학습 데이터로 축적)</span></h3>
            <div class="stars" id="stars"></div>
            <div class="tags" id="fbTags"></div>
            <button id="fbSaveBtn" class="btn small">평가 저장</button>
          </section>
        </aside>
      </div>
    </div>
  </div>

  <dialog id="matEditDlg">
    <h2>자료 편집</h2>
    <label>제목 <input id="meTitle"></label>
    <label>출처 (필수) <input id="meSource"></label>
    <label>본문 <textarea id="meContent" style="width:100%; min-height:140px; font-family:var(--sans); font-size:13.5px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-top:4px"></textarea></label>
    <div class="row">
      <button id="meSaveBtn" class="btn primary">저장</button>
      <button id="meCloseBtn" class="btn ghost">닫기</button>
    </div>
  </dialog>

  <dialog id="dashDlg">
    <h2>자동화 성숙도 지표</h2>
    <p class="hint">단계별 평균 수정량(edit distance)과 평점. 수정량이 내려가면 자동화 성숙도가 올라가는 것입니다.</p>
    <div id="dashBody" style="margin-top:10px; font-size:13.5px"></div>
    <div class="row">
      <button id="dashBackupBtn" class="btn">프로젝트 백업 zip 생성</button>
      <button id="dashCloseBtn" class="btn ghost">닫기</button>
    </div>
  </dialog>

  <dialog id="projectDlg" class="project-dialog">
    <div class="dialog-head">
      <div>
        <h2 id="projectDlgTitle">프로젝트 이름 변경</h2>
        <p id="projectDlgSub" class="hint">기사 내용과 자료는 그대로 유지됩니다.</p>
      </div>
      <button id="projectCloseBtn" class="icon-btn" type="button" aria-label="닫기">×</button>
    </div>
    <label>기사 제목
      <input id="projectTitleInput" placeholder="예: DGIST 조정부, 다시 노를 젓다" maxlength="120">
    </label>
    <p id="projectError" class="form-error" role="alert"></p>
    <div class="row">
      <button id="projectSaveBtn" class="btn primary" type="button">이름 저장</button>
      <button id="projectCancelBtn" class="btn ghost" type="button">취소</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
